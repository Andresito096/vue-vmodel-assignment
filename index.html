<!doctype html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <title>V-Model Custom Component</title>
    <script src="https://unpkg.com/vue@3"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/foundation-sites@6.9.0/dist/css/foundation.min.css" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/foundation-sites@6.9.0/dist/js/foundation.min.js" crossorigin="anonymous"></script>
</head>

<body>
    <div id="app">
        <h1>V-Model Custom Component</h1>
        <h4>By: Andres Orozco</h4>
        <custom-input v-model="value"></custom-input>

        <p>Current value: {{ value }}</p>
        <p style="margin-top: 1.5rem; padding: 1rem; background: #e8f4ff; border-left: 4px solid #1779ba; border-radius: 4px; color: #17496b;">
            This assignment is now deployed through Netlify.
        </p>
    </div>

    <script>
        Vue.createApp({
            data() {
                return {
                    value: ''
                }
            },

            components: {
                'custom-input': {
                    props: ['modelValue'],
                    template: `
                         <div>
                            <input type="text" style="max-width: 600px;" :value="modelValue" @input="$emit('update:modelValue', $event.target.value)">
                        </div>
                    `
                }
            }
        }).mount('#app');
    </script>
</body>
</html>
