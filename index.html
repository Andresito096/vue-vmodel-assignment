<!doctype html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <title>V-Model Custom Component</title>
    <script src="https://unpkg.com/vue@3"></script>
</head>

<body>
    <div id="app">
        <h1>V-Model Custom Component</h1>
        <custom-input v-model="value"></custom-input>

        <p>Current value: {{ value }}</p>
    </div>

    <script>
        Vue.createApp({
            data() {
                return {
                    value: ''
                }
            },

            components: {
                'custom-input': {
                    props: ['modelValue'],
                    template: `
                         <div>
                            <input type="text" :value="modelValue" @input="$emit('update:modelValue', $event.target.value)">
                        </div>
                    `
                }
            }
        }).mount('#app');
    </script>
</body>
</html>
